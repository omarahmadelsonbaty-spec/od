<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Static AI Chat Layout</title>
</head>
<body style="margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #131314; color: #e3e3e3; height: 100vh; display: flex; overflow: hidden;">
  
  <aside style="width: 260px; background-color: #1e1e1f; border-right: 1px solid #2d2d2e; display: flex; flex-direction: column; padding: 16px;">
    <button id="new" style="width: 100%; padding: 10px 16px; background-color: #2b2b2c; color: #ffffff; border: 1px solid #3c3c3e; border-radius: 8px; cursor: pointer; text-align: left; font-weight: 500;">+ New Chat</button>
  </aside>

  <main style="flex: 1; display: flex; flex-direction: column; background-color: #131314;">
    
    <header style="height: 56px; border-bottom: 1px solid #2d2d2e; display: flex; align-items: center; padding: 0 24px; font-weight: 600;">
      Omar baby's special AI chat bot
    </header>

    <section id="chat-box" style="flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px;">
      <div style="background-color: #1e1e1f; border: 1px solid #2d2d2e; padding: 12px 16px; border-radius: 12px; max-width: 800px; width: 100%; margin: 0 auto; box-sizing: border-box;">
        System online. Type a message below.
      </div>
    </section>

    <footer style="padding: 16px 24px 24px; max-width: 800px; width: 100%; margin: 0 auto; box-sizing: border-box;">
      <div style="background-color: #1e1e1f; border: 1px solid #3c3c3e; border-radius: 12px; padding: 10px 14px; display: flex;">
        <input type="text" id="t" placeholder="Type a message..." style="flex: 1; background: transparent; border: none; outline: none; color: #ffffff; font-size: 0.95rem;">
      </div>
    </footer>

    <script>
      const BACKEND_URL = window.location.hostname === 'localhost' 
          ? 'http://localhost:8000' 
          : 'https://aifixed.onrender.com';

      const input = document.getElementById("t");
      const box = document.getElementById("chat-box");
      const newchat = document.getElementById("new");
      
      newchat.addEventListener('click', async () => {
        box.innerHTML = `
          <div style="background-color: #1e1e1f; border: 1px solid #2d2d2e; padding: 12px 16px; border-radius: 12px; max-width: 800px; width: 100%; margin: 0 auto; box-sizing: border-box;">
            System online. Type a message below.
          </div>
        `;
        input.value = "";

        try {
          await fetch(`${BACKEND_URL}/history`, { method: 'DELETE' });
        } catch (err) {
          console.error("Could not clear history on server:", err);
        }
      });

      input.addEventListener('keydown', async (event) => {
        if (event.key === 'Enter') {
          const usertext = input.value.trim();
          if (!usertext) return;

          input.value = "";

          const userDiv = document.createElement('div');
          userDiv.style.cssText = "background-color: #2b2b2c; border: 1px solid #3c3c3e; padding: 12px 16px; border-radius: 12px; max-width: 800px; width: 100%; margin: 0 auto; box-sizing: border-box; white-space: pre-wrap;";
          userDiv.textContent = usertext;
          box.appendChild(userDiv);

          const loadingDiv = document.createElement('div');
          loadingDiv.style.cssText = "background-color: #1e1e1f; border: 1px solid #2d2d2e; padding: 12px 16px; border-radius: 12px; max-width: 800px; width: 100%; margin: 0 auto; box-sizing: border-box; color: #8e8e93;";
          loadingDiv.textContent = "Thinking...";
          box.appendChild(loadingDiv);
          box.scrollTop = box.scrollHeight;

          try {
            const response = await fetch(`${BACKEND_URL}/chat`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ message: usertext })
            });

            if (!response.ok) throw new Error('Network response failed');

            const data = await response.json();

            loadingDiv.style.color = "#e3e3e3";
            loadingDiv.style.whiteSpace = "pre-wrap";
            loadingDiv.textContent = data.response;

          } catch (error) {
            console.error('Error:', error);

            loadingDiv.style.color = "#ff6b6b";
            loadingDiv.textContent = "Error: Failed to fetch response from backend.";
          }
          box.scrollTop = box.scrollHeight;
        }
      });
    </script>
  </main>
</body>
</html>
