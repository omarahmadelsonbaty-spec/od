<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retix AI</title>
    <style>
        * { 
            box-sizing: border-box; 
        }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: rgba(16, 200, 160, 0.21);
            color: #000;
            font-family: Arial, sans-serif;
        }
        .card {
            width: min(720px, calc(100% - 40px));
            padding: 120px;
            border: 4px solid #e8e8e8;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.05);
        }
        h1 { 
            margin: 0 0 16px; 
            font-size: 20px; 
            font-weight: 600; 
            text-align: center; 
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input, button {
            width: 100%;
            height: 48px;
            border-radius: 7px;
            font: inherit;
        }
        input {
            padding: 0 13px;
            border: 1px solid #d8d8d8;
            outline: none;
        }
        input:focus { 
            border-color: #777; 
        }
        button {
            margin-top: 12px;
            border: 0;
            background: #222;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { 
            background: #444; 
        }
        button:disabled { 
            background: #888; 
            cursor: not-allowed; 
        }
        #result { 
            min-height: 20px; 
            margin: 16px 0 0; 
            text-align: center; 
            font-weight: bold;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <main class="card">
        <h1>Retix AI</h1>
        
        <div class="input-group">
            <input id="retix" type="text" placeholder="Ask Retix AI..." autocomplete="off">
        </div>
        <button id="evaluate" type="button">Send</button>
        <p id="result" aria-live="polite"></p>
    </main>

<script>
    const input = document.getElementById("retix");
    const evaluateBtn = document.getElementById("evaluate");
    const responseEl = document.getElementById("result");

    input.addEventListener("keypress", (e) => {
        if (e.key === "Enter") evaluateBtn.click();
    });

    evaluateBtn.addEventListener("click", async () => {
        const text = input.value.trim();
        
        if (!text) {
            responseEl.textContent = "Please enter text first.";
            return;
        }

        // Clear input box and set pending state
        input.value = "";
        evaluateBtn.disabled = true;
        evaluateBtn.textContent = "Thinking...";
        responseEl.textContent = "";

        try {
          const res = await fetch("/chat", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ input: text })
        });
            if (!res.ok) {
                throw new Error(`Server error: ${res.status}`);
            }

            const data = await res.json();
            responseEl.textContent = data.response;
        } catch (err) {
            responseEl.textContent = `Error: ${err.message}. Is your backend running?`;
        } finally {
            evaluateBtn.disabled = false;
            evaluateBtn.textContent = "Send";
        }
    });
</script>

</body>
</html>
